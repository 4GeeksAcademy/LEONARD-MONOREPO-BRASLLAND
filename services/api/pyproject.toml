[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brasaland-api"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
	"fastapi==0.135.1",
	"uvicorn==0.41.0",
	"python-multipart==0.0.22",
	"httpx==0.28.1",
	"tinydb==4.8.2",
	"pydantic[email]>=2.12,<3",
	"python-jose[cryptography]>=3.5.0",
	"passlib[bcrypt]>=1.7.4",
	"bcrypt==4.0.1",
	"python-dotenv>=1.2.4",
	"sqlmodel>=0.0.24,<1",
	"psycopg[binary]>=3.2,<4",
]

[project.scripts]
seed = "services.api.seed:main"

[tool.setuptools]
packages = ["services.api", "services.api.app", "services.api.routers"]
package-dir = {"services.api" = "."}
